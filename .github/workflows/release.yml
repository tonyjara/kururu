# Turn a tag into a release people can install.
#
# The tag is the trigger and the changelog is the text: `/release 0.2.0` stamps
# the section, bumps the four manifests, commits and tags, and everything below
# is what that tag sets off. Nothing here decides anything — if this workflow
# ever needs a judgement call made in it, the call belongs in the skill, where a
# person is watching.
#
# It builds both architectures in ONE electron-builder invocation on purpose.
# `latest-mac.yml` is the feed electron-updater reads, and a second invocation
# overwrites the first's rather than adding to it — so building them separately
# ships an updater that can only see whichever arch ran last.
#
# Signing is `CSC_LINK`/`CSC_KEY_PASSWORD`: electron-builder imports the .p12
# into a temporary keychain it makes and throws away. That is also why the
# ambiguity that bit locally cannot happen here — the keychain it builds holds
# exactly one certificate, because it only ever put one in.
name: release

on:
  push:
    tags: ["v*"]
  # So a failed publish can be retried without moving a tag, which would leave a
  # release whose notes and binary disagree.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Read the version, and refuse a tag that disagrees with it
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          MANIFEST=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$MANIFEST" ]; then
            echo "::error::tag $TAG does not match package.json ($MANIFEST)."
            echo "::error::/release bumps all four manifests with the tag; one of them was missed."
            exit 1
          fi
          echo "version=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile

      # Before anything is signed. A release that does not typecheck is a release
      # somebody has to yank, and yanking is what the version guard above exists
      # to make unnecessary.
      - run: bun run typecheck
      - run: bun test

      - name: The notes, which must exist before a minute is spent building
        run: node tools/release-notes.mjs "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/notes.md"

      # The certificate is imported by hand rather than through electron-builder's
      # `CSC_LINK`, and that is not a preference. `importCerts` in
      # app-builder-lib creates its temporary keychain with a random 32-byte
      # password and then calls `set-key-partition-list -k <the .p12 password>`
      # to unlock it — two different secrets, so it fails every time with
      # `SecKeychainUnlock: The user name or passphrase you entered is not
      # correct`, which reads exactly like a wrong password in the repository's
      # secrets and is not. Doing it here costs a dozen lines and takes signing
      # out of the part that is broken.
      #
      # It also guarantees what the local build had to be fixed by hand to get:
      # this keychain holds exactly one certificate, so codesign can never be
      # ambiguous about which to use.
      - name: Import the signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/kururu.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No auto-lock and no timeout: a keychain that relocks halfway through
          # signing fails on a file somewhere in the middle of the bundle.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign prompts for permission to use the key — and a
          # runner has nobody to answer, so it hangs until the job times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Prepended to the search list rather than replacing it, or the system
          # roots go missing and nothing validates.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, sign and notarize
        env:
          # No CSC_LINK: the certificate is already in the keychain the step above
          # built, and electron-builder finds it there by auto-discovery.
          CSC_KEYCHAIN: ${{ env.KEYCHAIN }}
          # Two credential shapes, and `desktop/notarize.mjs` takes whichever is
          # present: an App Store Connect API key, or an Apple ID with an
          # app-specific password. Both are what `notarytool store-credentials`
          # accepts, and which one somebody stored is not recoverable from the
          # profile afterwards — so the workflow supports both rather than
          # guessing and failing a release over it.
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The key is written here rather than in a step of its own because the
          # `secrets` context is not available in a step-level `if`, and a shell
          # test is clearer than the job-level env dance that works around it.
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            chmod 600 "$RUNNER_TEMP/notary.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/notary.p8"
          elif [ -z "$APPLE_ID" ]; then
            echo "::error::no notarization credentials — set APPLE_API_KEY_P8 (+ ID and ISSUER) or APPLE_ID (+ password and team)"
            exit 1
          fi
          bun run build
          ./node_modules/.bin/electron-builder --projectDir desktop \
            --mac dmg zip --arm64 --x64 --publish never

      # Whatever happens next, neither secret stays on disk a moment longer.
      - name: Shred the key and the keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/kururu.keychain-db" 2>/dev/null || true

      - name: Say what came out, and refuse to publish half a release
        run: |
          ls -lh release/*.dmg release/*.zip release/latest-mac.yml
          test -f release/latest-mac.yml || { echo "::error::no latest-mac.yml — the updater would have nothing to read"; exit 1; }
          test "$(ls release/*.dmg | wc -l)" -eq 2 || { echo "::error::expected two DMGs, one per architecture"; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "kururu ${{ steps.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            release/*.dmg release/*.zip release/latest-mac.yml
