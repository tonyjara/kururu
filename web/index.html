<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale=1 is what stops iOS Safari zooming in on a focused field under 16px, which it never zooms back out of. Safari still lets a pinch zoom past it; Android does not, and focus never zooms there anyway. The 16px floor in styles.css is the other half. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f0e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>kururu</title>
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- With credentials: a manifest is fetched without them otherwise, and a shared server refuses a request with no cookie. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
