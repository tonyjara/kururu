<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'" />
    <title>Kururu pen</title>
    <!--
      The screen pen's overlay (docs/plans/screen-annotate.md): one of these
      per display, transparent, over everything, while a session is on. It
      draws the ink as it is drawn, for no lag, and tells the main process
      each stroke (`ink.js` keeps them and takes the pictures); it fades a
      burst three seconds after its pen last lifted, since its picture is
      taken and old ink over a screen that moved on misleads. The tools are
      not here: they are in the pill, or in the toolbar's own window
      (`inkbar.html`), which can be dragged where this could not.

      A file the app ships and not a page of the web build: nothing here may
      depend on a server that `bun run dev` restarts on a save, because a
      stuck overlay is a Mac where nothing can be clicked.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font: 13px/1.2 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }
      body.pen {
        cursor: crosshair;
      }
      /* Slack's "this screen is live": a thin edge round every display while the pen is down. */
      body.pen::after {
        content: "";
        position: fixed;
        inset: 0;
        border: 3px solid rgba(255, 46, 84, 0.75);
        pointer-events: none;
      }
      .toast {
        position: fixed;
        top: 110px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 12px;
        border-radius: 8px;
        background: rgba(28, 28, 30, 0.92);
        color: #f2f2f7;
      }
      .toast[hidden] {
        display: none;
      }
      .flash {
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.35);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease-out;
      }
      .flash.on {
        opacity: 1;
        transition: none;
      }
    </style>
  </head>
  <body>
    <canvas id="ink"></canvas>
    <div class="toast" id="toast" hidden></div>
    <div class="flash" id="flash"></div>
    <script>
      "use strict";
      /** `BURST_GAP_MS` and `FADE_AFTER_MS` in `shared/ink.ts`. */
      const BURST_GAP_MS = 1200;
      const FADE_AFTER_MS = 3000;
      const FADE_MS = 500;
      /** The pens and the highlighter, as the helper draws them on the pictures (`glance.swift`). */
      const LOOKS = {
        red: { color: "rgba(255, 46, 84, 0.85)", width: 3 },
        blue: { color: "rgba(10, 132, 255, 0.85)", width: 3 },
        highlighter: { color: "rgba(255, 214, 0, 0.4)", width: 16 },
      };

      const bridge = window.ink;
      const canvas = document.getElementById("ink");
      const ctx = canvas.getContext("2d");
      const toast = document.getElementById("toast");
      const now = () => performance.timeOrigin + performance.now();

      let pen = true;
      let tool = "pen";
      let color = "red";
      /** Bursts as drawn here, for the fade: each a list of strokes and when it fades. */
      const bursts = [];
      let drawing = null;
      let lastUp = 0;
      let pending = [];
      let frame = 0;

      function size() {
        const ratio = window.devicePixelRatio || 1;
        canvas.width = Math.round(innerWidth * ratio);
        canvas.height = Math.round(innerHeight * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        paint();
      }

      function paint() {
        frame = 0;
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        const t = now();
        let fading = false;
        for (let i = bursts.length - 1; i >= 0; i--) {
          const burst = bursts[i];
          const alpha = burst.fadeAt === null || t < burst.fadeAt ? 1 : 1 - (t - burst.fadeAt) / FADE_MS;
          if (alpha <= 0) {
            bursts.splice(i, 1);
            continue;
          }
          if (burst.fadeAt !== null) fading = true;
          ctx.globalAlpha = alpha;
          // The highlighter under the pens, as on the pictures.
          const strokes = [...burst.strokes].sort((a, b) => (a.look === LOOKS.highlighter ? 0 : 1) - (b.look === LOOKS.highlighter ? 0 : 1));
          for (const stroke of strokes) {
            ctx.lineWidth = stroke.look.width;
            ctx.strokeStyle = stroke.look.color;
            ctx.beginPath();
            ctx.moveTo(stroke[0][0], stroke[0][1]);
            if (stroke.length === 1) ctx.lineTo(stroke[0][0] + 0.1, stroke[0][1]);
            for (let j = 1; j < stroke.length; j++) ctx.lineTo(stroke[j][0], stroke[j][1]);
            ctx.stroke();
          }
        }
        ctx.globalAlpha = 1;
        // Again while anything is fading or waiting to; a still screen costs nothing.
        if (fading) schedule();
      }

      function schedule() {
        if (!frame) frame = requestAnimationFrame(paint);
      }

      function flush() {
        if (pending.length) bridge.points(pending);
        pending = [];
      }

      window.addEventListener("pointerdown", (event) => {
        if (!pen || event.button !== 0) return;
        event.preventDefault();
        canvas.setPointerCapture(event.pointerId);
        const point = [event.clientX, event.clientY];
        const t = now();
        let burst = bursts[bursts.length - 1];
        // A stroke soon after the last one is more of the same mark, and fades with it.
        if (burst && (burst.closed || (burst.fadeAt !== null && t - lastUp > BURST_GAP_MS))) burst = null;
        if (!burst) {
          burst = { strokes: [], fadeAt: null };
          bursts.push(burst);
        }
        burst.fadeAt = null;
        const stroke = [point];
        stroke.look = tool === "highlighter" ? LOOKS.highlighter : LOOKS[color] || LOOKS.red;
        drawing = { pointerId: event.pointerId, stroke, burst };
        burst.strokes.push(stroke);
        bridge.begin(point, t);
        schedule();
      });

      window.addEventListener("pointermove", (event) => {
        if (!drawing || event.pointerId !== drawing.pointerId) return;
        // Every sample the pointer gave since the last event, so a fast circle is round.
        const samples = typeof event.getCoalescedEvents === "function" ? event.getCoalescedEvents() : [event];
        for (const sample of samples.length ? samples : [event]) {
          const point = [sample.clientX, sample.clientY];
          drawing.stroke.push(point);
          pending.push(point);
        }
        if (pending.length > 64) flush();
        schedule();
      });

      function lift(event) {
        if (!drawing || event.pointerId !== drawing.pointerId) return;
        flush();
        lastUp = now();
        drawing.burst.fadeAt = lastUp + FADE_AFTER_MS;
        drawing = null;
        bridge.end(lastUp);
        schedule();
      }
      window.addEventListener("pointerup", lift);
      window.addEventListener("pointercancel", lift);
      setInterval(() => drawing && flush(), 32);

      // Main took the last mark on this display back: its ink comes off now rather than fading.
      bridge.onUndo(() => {
        if (drawing) return;
        bursts.pop();
        schedule();
      });

      const flash = document.getElementById("flash");
      bridge.onFlash(() => {
        flash.classList.add("on");
        requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.remove("on")));
      });

      bridge.onState((state) => {
        // The pen lifted or put down again starts a new mark in main, so here too.
        if ((state.pen === true) !== pen && bursts.length) bursts[bursts.length - 1].closed = true;
        pen = state.pen === true;
        tool = state.tool === "highlighter" ? "highlighter" : "pen";
        color = state.color === "blue" ? "blue" : "red";
        document.body.classList.toggle("pen", pen);
      });

      let toastTimer = 0;
      bridge.onFull((max) => {
        toast.textContent = `${max} marks is the most one message takes — Send or Done, then start again.`;
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (toast.hidden = true), 4000);
      });

      window.addEventListener("resize", size);
      size();
    </script>
  </body>
</html>
