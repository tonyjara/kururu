# What a downloadable kururu is made of.
#
# The shape follows the architecture rather than electron-builder's defaults. The
# three processes do not change when kururu is packaged — the window still finds
# a server and draws it, the server still spawns a detached pty host — so what a
# bundle has to do is put all three where each can find the others, and nothing
# more clever than that.
#
# The server and the host are NOT in the asar. They are spawned as separate
# processes by path, which an asar can serve but only through Electron's patched
# fs; running them out of `Resources/server` keeps the spawn an ordinary one and
# keeps their sourcemaps readable when somebody sends a stack trace. `web/dist`
# and `assets` are beside them for the same reason: the server already resolves
# both from environment variables, and the window sets those at spawn.
#
# node-pty and ws are copied in whole. They are `external` in the esbuild bundle
# — node-pty because it is native and cannot be inlined, ws alongside it so the
# two are found the same way — so the packaged server resolves them by walking up
# from `Resources/server/server.mjs` to `Resources/node_modules`, which is
# ordinary Node resolution and needs nothing special from us.
appId: io.github.tonyjara.kururu
productName: Kururu
copyright: Copyright 2026 tonyjara

directories:
  output: ../release

# node-pty ships N-API prebuilds, which load unchanged in both Node 24 and
# Electron 44 — so there is nothing to rebuild, and a rebuild step here would be
# the "fix" `CLAUDE.md` warns against for a spawn failure whose real cause is an
# executable bit.
npmRebuild: false

# Everything the *window* is. The three processes below it travel as resources.
files:
  - main.js
  - preload.js
  - connect.html
  - servers.js
  - desktop.js
  - runner.js
  - menu.js
  - tray.js
  - talkkey.js
  - icon/icon-1024.png
  - icon/trayTemplate.png
  - icon/trayTemplate@2x.png

extraResources:
  # `dist` holds the server, the host, the hook report, Kokoro — and the
  # talk-key hook, a bare Mach-O beside them. node-pty's `spawn-helper` is
  # the precedent for a bare binary in Resources being signed and notarized
  # with the rest; that it holds for this one is UNVERIFIED as of 0.2.0.
  - from: dist
    to: server
  # The supervisor, so the app runs the same one `bun run dev` does. Plain
  # JavaScript with no imports outside node, run on the app's own binary.
  - from: ../server/run.mjs
    to: server/run.mjs
  - from: ../web/dist
    to: web
  - from: ../assets
    to: assets
  # node-pty is 62MB on disk and 58MB of that is Windows: two `conpty` builds and
  # their `OpenConsole.exe`, which kururu has no use for and which codesign would
  # otherwise be asked to sign — a Windows binary inside a notarized Mac app, for
  # nothing. Only the loader and the two darwin prebuilds travel. `lib/utils.js`
  # looks in `build/Release`, `build/Debug` and then
  # `prebuilds/<platform>-<arch>`, so this is exactly what it will go looking for.
  - from: ../node_modules/node-pty
    to: node_modules/node-pty
    filter:
      - package.json
      - LICENSE
      - lib/**
      - prebuilds/darwin-arm64/**
      - prebuilds/darwin-x64/**
  - from: ../node_modules/ws
    to: node_modules/ws
  # The voice's stack, so the packaged server can speak with Kokoro. Darwin
  # binaries only, on node-pty's reasoning; `onnxruntime-node` carries Linux
  # and Windows builds that would otherwise be signed for nothing. The server
  # imports all of this lazily and falls back to the Mac's own voices if any
  # of it is missing, so an incomplete copy costs a voice and not the app.
  # UNVERIFIED in a built DMG as of 0.2.0 — see docs/voice.md.
  - from: ../node_modules/kokoro-js
    to: node_modules/kokoro-js
  - from: ../node_modules/phonemizer
    to: node_modules/phonemizer
  - from: ../node_modules/@huggingface/transformers
    to: node_modules/@huggingface/transformers
  - from: ../node_modules/@huggingface/jinja
    to: node_modules/@huggingface/jinja
  - from: ../node_modules/onnxruntime-common
    to: node_modules/onnxruntime-common
  - from: ../node_modules/onnxruntime-web
    to: node_modules/onnxruntime-web
  - from: ../node_modules/onnxruntime-node
    to: node_modules/onnxruntime-node
    filter:
      - package.json
      - LICENSE
      - dist/**
      - bin/napi-v3/darwin/**
  - from: ../node_modules/sharp
    to: node_modules/sharp
  - from: ../node_modules/@img
    to: node_modules/@img
    filter:
      - sharp-darwin-*/**
      - sharp-libvips-darwin-*/**
      - colour/**

mac:
  category: public.app-category.developer-tools
  icon: icon/kururu.icns
  # The microphone. macOS refuses the device to an app whose Info.plist does
  # not say why it wants it, silently, as a stream with no samples in it.
  extendInfo:
    NSMicrophoneUsageDescription: Kururu listens while you hold the talk key, so you can speak to the harness. Nothing is recorded otherwise.
  # Two DMGs rather than one universal binary. A universal Electron is both
  # copies of everything and about twice the download, paid by every arm64 user
  # to spare an Intel one a choice of two links — and a Homebrew cask picks the
  # right one by architecture anyway.
  target:
    - target: dmg
      arch: [arm64, x64]
    # The zip is not a second download offered to anybody. Squirrel.Mac — what
    # electron-updater drives — can only apply an update from a zip, so this is
    # the artifact the in-app updater fetches and the DMG is the one people click.
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  # Relative to the workspace root, like `afterSign` below and unlike `files` and
  # `extraResources` above, which are relative to `--projectDir`. The path is not
  # resolved by electron-builder at all — it is handed to codesign as written,
  # and codesign resolves it against its own working directory. A wrong one fails
  # as `cannot read entitlement data`, which names the plist and not the path.
  entitlements: desktop/entitlements.mac.plist
  entitlementsInherit: desktop/entitlements.mac.plist
  # No `identity` here on purpose, and it was tried the other way first. Naming
  # one pins nothing useful — electron-builder resolves whatever it is given back
  # to the certificate's *name* before handing it to codesign, so a fingerprint
  # does not survive the trip and codesign still refuses an ambiguous match
  # between two certificates called the same thing. It also overrides
  # `CSC_IDENTITY_AUTO_DISCOVERY=false`, which is how an unsigned build is asked
  # for. So the keychain is expected to hold exactly one Developer ID
  # Application certificate, and auto-discovery finds it.
  # Gatekeeper cannot assess an app that has not been notarized yet, and it is
  # notarized in the hook below — asking here would fail every build.
  gatekeeperAssess: false
  # Done by `notarize.mjs` instead, because the credentials live in a keychain
  # profile on this machine and electron-builder's own path only reads them from
  # the environment. The hook takes either.
  notarize: false

dmg:
  # The window it opens in: the app on the left, Applications on the right, which
  # is the gesture every Mac user already knows.
  #
  # These are electron-builder's own default positions and they are copied here
  # rather than left out, because the background art is drawn *for* them. The
  # stock background is a 540x380 plate with a dashed arrow on it, and that arrow
  # is positioned for icons at y=220 — so the first spelling of this block, which
  # moved them up to y=190 for no reason anybody recorded, put both icons a clear
  # thirty pixels above the arrow pointing between them. Nothing warns about it:
  # the DMG builds, opens and works, and only looks subtly wrong. If the art is
  # ever replaced with kururu's own, these move with it.
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

# Relative to the *workspace root* rather than to `--projectDir`, which is where
# electron-builder resolves a hook from once it has detected a monorepo.
afterSign: desktop/notarize.mjs

publish:
  provider: github
  owner: tonyjara
  repo: kururu
