<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'" />
    <title>Kururu pen tools</title>
    <!--
      The screen pen's toolbar, for a session whose tools are not in the
      floating pill (`ink.js` says which): the drawer's pencil, or a recording
      in the window while the talk key is not hooked. A small window of its
      own over the overlays, so it can be dragged anywhere — by any part of
      it that is not a button — and is put back where it was left next time;
      the toolbar that sat inside an overlay could do neither.

      A file the app ships, for `ink.html`'s reason: nothing a session needs
      to end may depend on a server that `bun run dev` restarts on a save.
      It speaks through `inkpreload.js`, and main takes its presses only from
      the toolbar of the session that is on.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        font: 13px/1.2 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      body {
        /* Room for the shadow, which the window's edge would otherwise cut. */
        padding: 8px;
        display: inline-block;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 6px 6px 8px;
        border-radius: 999px;
        background: rgba(28, 28, 30, 0.92);
        color: #f2f2f7;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        white-space: nowrap;
        cursor: grab;
        -webkit-app-region: drag;
      }
      .grip {
        width: 8px;
        height: 16px;
        opacity: 0.5;
        background-image: radial-gradient(circle, #f2f2f7 1px, transparent 1.5px);
        background-size: 4px 4px;
      }
      .count {
        font-variant-numeric: tabular-nums;
        opacity: 0.8;
        min-width: 0;
      }
      .count:empty {
        display: none;
      }
      button {
        -webkit-app-region: no-drag;
        font: inherit;
        color: inherit;
        border: 0;
        border-radius: 999px;
        padding: 5px 11px;
        background: rgba(255, 255, 255, 0.12);
        cursor: pointer;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.22);
      }
      button.on {
        background: rgba(255, 46, 84, 0.9);
      }
      button.done {
        background: #f2f2f7;
        color: #1c1c1e;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .sep {
        width: 1px;
        align-self: stretch;
        margin: 4px 2px;
        background: rgba(255, 255, 255, 0.18);
      }
      button.swatch {
        width: 26px;
        height: 26px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      button.swatch::before {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--swatch);
      }
      button.swatch.highlighter::before {
        width: 14px;
        height: 8px;
        border-radius: 2px;
      }
      button.swatch.picked {
        box-shadow: inset 0 0 0 2px #f2f2f7;
      }
    </style>
  </head>
  <body>
    <div class="bar" id="bar" title="Drag to move; it stays where you leave it">
      <span class="grip" aria-hidden="true"></span>
      <span class="count" id="count"></span>
      <button id="pen" title="The pen on or off: off, clicks go to the app under the ink (⌃⌥⌘D, or Esc to lift it)">Pen</button>
      <button id="red" class="swatch" style="--swatch: rgb(255, 46, 84)" title="The red pen" aria-label="Red pen"></button>
      <button id="blue" class="swatch" style="--swatch: rgb(10, 132, 255)" title="The blue pen" aria-label="Blue pen"></button>
      <button id="highlighter" class="swatch highlighter" style="--swatch: rgb(255, 214, 0)" title="The highlighter, for a line of text" aria-label="Highlighter"></button>
      <span class="sep"></span>
      <button id="undo" title="Take the last mark back (⌘Z with the pen down)">Undo</button>
      <button id="snap" title="A picture of the display under the pointer, now, as a mark with no ink (⌃⌥⌘S)">Snap</button>
      <button id="done" class="done"></button>
      <button id="drop" title="Drop the marks and close the pen" aria-label="Drop">✕</button>
    </div>
    <script>
      "use strict";
      const voice = new URLSearchParams(location.search).get("voice") === "1";
      const bridge = window.ink;
      const bar = document.getElementById("bar");
      let color = "red";

      document.getElementById("pen").addEventListener("click", () => bridge.bar("pen"));
      document.getElementById("done").addEventListener("click", () => bridge.bar("done"));
      document.getElementById("drop").addEventListener("click", () => bridge.bar("drop"));
      document.getElementById("undo").addEventListener("click", () => bridge.bar("undo"));
      document.getElementById("snap").addEventListener("click", () => bridge.bar("snap"));
      document.getElementById("red").addEventListener("click", () => bridge.style("pen", "red"));
      document.getElementById("blue").addEventListener("click", () => bridge.style("pen", "blue"));
      document.getElementById("highlighter").addEventListener("click", () => bridge.style("highlighter", color));

      const done = document.getElementById("done");
      done.textContent = voice ? "Send" : "Done";
      done.title = voice ? "Send what you said and drew to Kuru" : "Put the marks in Kuru's box";

      bridge.onState((state) => {
        const pen = state.pen === true;
        const tool = state.tool === "highlighter" ? "highlighter" : "pen";
        color = state.color === "blue" ? "blue" : "red";
        const marks = Number(state.marks) || 0;
        document.getElementById("count").textContent = marks ? `${marks} mark${marks === 1 ? "" : "s"}` : "";
        document.getElementById("red").classList.toggle("picked", tool === "pen" && color === "red");
        document.getElementById("blue").classList.toggle("picked", tool === "pen" && color === "blue");
        document.getElementById("highlighter").classList.toggle("picked", tool === "highlighter");
        document.getElementById("undo").disabled = !marks;
        const penButton = document.getElementById("pen");
        penButton.textContent = pen ? "Pen on" : "Pen off";
        penButton.classList.toggle("on", pen);
      });

      // The window is sized to the bar, with the body's room for the shadow,
      // so nothing transparent of it sits over the screen taking clicks.
      const report = () => {
        const box = bar.getBoundingClientRect();
        bridge.barSize(box.width + 16, box.height + 16);
      };
      new ResizeObserver(report).observe(bar);
      report();
    </script>
  </body>
</html>
